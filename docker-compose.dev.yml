version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: custom_booru_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/custom_booru_development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - storage_data_dev:/app/storage
      - ./backend:/app
      - /app/vendor/bundle
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      PUBLIC_VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "4173:4173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"

volumes:
  postgres_data_dev:
  storage_data_dev: